name: Database contract

on:
  pull_request:
  push:
    branches: [main]

# No secrets: this repository and the Knowledge Services repository are public. Actions are pinned to a release commit.
permissions:
  contents: read

# Fresh-chain verification runs only in an explicitly disposable Supabase workdir. The shared `aiengineer`
# project identity in supabase/config.toml is never started, migrated or reset here, and the
# reset-disposable-local.mjs guard is unchanged.
#
# The job proves the current head on a fresh install from empty: the root installer (component, every migration,
# custody and api-surface checks), every SQL suite that applies to this head, the generated types, and the committed
# schema workspace against the installed database.
#
# Gate (Sprint V SV-17): the AIDB binding migration 20261024010000 refuses to apply without the common
# knowledge_verification component, so the component is installed first by scripts/install-ai-engineer.mjs,
# which pins its version and digest and refuses any other bytes. The component lives in the Knowledge Services
# repository, public at jbell-rusty-vantage/agent-knowledge-services (2026-11-06 clean slate; pre-move commit IDs do not
# exist there). KS_COMPONENT_REF (repository variable) pins the commit that carries the pinned release and defaults to main.
# If the ref lacks the pinned bytes the installer refuses and the job fails; it never skips the gate.
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DISPOSABLE_WORKDIR: .ci/disposable
      DB_CONTAINER: supabase_db_disposable-ci-aidb
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.34.5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm run typecheck
      - run: npm test
      # The version label identifies the chain: fails when supabase/migrations is newer than the head recorded for
      # the version in package.json (contract.version.json), or the committed workspace was generated under another one.
      - run: npm run version:check
      - name: Check out the Knowledge Services component (version + digest pinned by the installer)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: jbell-rusty-vantage/agent-knowledge-services
          ref: ${{ vars.KS_COMPONENT_REF || 'main' }}
          path: .ci/knowledge-services
      - name: Build the component CLI
        working-directory: .ci/knowledge-services
        run: |
          corepack enable
          pnpm install --frozen-lockfile --filter "@aiengineer/knowledge-db-contract..."
          pnpm --filter @aiengineer/knowledge-db-contract build
      - name: Start a disposable database (empty migrations folder)
        run: |
          mkdir -p "$DISPOSABLE_WORKDIR/supabase/migrations"
          sed -e 's/^project_id = "aiengineer"$/project_id = "disposable-ci-aidb"/' supabase/config.toml > "$DISPOSABLE_WORKDIR/supabase/config.toml"
          grep -q '^project_id = "disposable-ci-aidb"$' "$DISPOSABLE_WORKDIR/supabase/config.toml"
          npx supabase db start --workdir "$DISPOSABLE_WORKDIR"
      - name: Component, then domain migrations, then custody/grants and the closed api surface (root installer)
        run: >-
          node scripts/install-ai-engineer.mjs --workdir "$DISPOSABLE_WORKDIR" --ks-root .ci/knowledge-services
          --component-installation-id 0195f0a0-5b08-7000-8000-0000000c1a1d --skip-mission-control
          --receipt .ci/install-receipt.json
      - name: Repeat install applies nothing
        run: >-
          node scripts/install-ai-engineer.mjs --workdir "$DISPOSABLE_WORKDIR" --ks-root .ci/knowledge-services
          --component-installation-id 0195f0a0-5b08-7000-8000-0000000c1a1d --skip-mission-control
          --receipt .ci/install-receipt-repeat.json
          && node -e "process.exit(JSON.parse(require('fs').readFileSync('.ci/install-receipt-repeat.json','utf8')).changed ? 1 : 0)"
      # Every *.sql file under supabase/tests runs, so a new suite runs by default. Each rolls back. A suite fails on a
      # psql error, on a pgTAP "not ok", or when it ran a different number of tests than it planned.
      # Not a suite of this loop: supabase/tests/research_report_v2_concurrency.mjs (with its fixture module) is a manual
      # two-session proof that commits its fixtures, needs its own database and still names the retired research schema.
      - name: SQL suites (every suite that applies to this head)
        run: |
          # Left out, one reason each: the fixtures of these suites were written for an earlier schema and need
          # rewriting; the objects they test still exist.
          left_out() {
            case "$1" in
              knowledge_model_temporal) echo "fixtures predate the entity attribute schemas and the current fact-stream vocabulary" ;;
              knowledge_service_capture_provenance) echo "3 of 8 fail: fixtures use capture methods (direct-http, mission-control) no longer in evidence.capture_method" ;;
              knowledge_service_governed_indexing) echo "1 of 16 fails: a vector item without a typed source is now refused earlier (23001, the test expects 23514)" ;;
              knowledge_service_publication_retrieval) echo "fixtures insert retrieval.projection_target columns the table no longer has (schema_version, canonical_table)" ;;
              source_native_packet_members) echo "fixtures use a document representation kind the check constraint no longer allows" ;;
              verification_evaluation_dataset_manifest) echo "1 of 5 fails: the dataset manifest artifact rule rejects the fixture artifact" ;;
              *) return 1 ;;
            esac
          }
          failed=0; passed=0; skipped=0
          for file in supabase/tests/*.sql; do
            suite=$(basename "$file" .sql)
            if reason=$(left_out "$suite"); then echo "SKIP $suite: $reason"; skipped=$((skipped + 1)); continue; fi
            if ! out=$(docker exec -i "$DB_CONTAINER" psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 -At -q < "$file" 2>&1); then
              echo "FAIL $suite"; tail -n 20 <<< "$out"; failed=$((failed + 1)); continue
            fi
            if grep -qE '^(not ok|# Looks like)' <<< "$out"; then
              echo "FAIL $suite"; grep -E '^(not ok|#)' <<< "$out" | head -n 40 || true; failed=$((failed + 1)); continue
            fi
            echo "PASS $suite"; passed=$((passed + 1))
          done
          echo "SQL suites: $passed passed, $failed failed, $skipped left out"
          test "$failed" -eq 0 && test "$passed" -gt 0
      - run: node scripts/generate-types.mjs --local --check --workdir="$DISPOSABLE_WORKDIR"
      # Committed workspace must match the disposable database (structure, grants, vocabularies, generated types).
      - id: workspace_check
        run: npm run workspace:check -- --db-url postgresql://postgres:postgres@127.0.0.1:54322/postgres
      # On drift, render the workspace from this freshly installed database and publish it as an artifact, so a
      # contributor without local Docker (cloud agents included) can commit the regenerated tree. The job still fails.
      - name: Regenerate the schema workspace (drift only)
        if: failure() && steps.workspace_check.outcome == 'failure'
        run: npm run workspace:build -- --db-url postgresql://postgres:postgres@127.0.0.1:54322/postgres
      - name: Upload the regenerated schema workspace (drift only)
        if: failure() && steps.workspace_check.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: schema-workspace
          path: workspace/
          if-no-files-found: error
      # Committed pages must re-render byte-for-byte from the committed IR, and every catalog example must execute.
      - run: npm run workspace:validate -- --db-url postgresql://postgres:postgres@127.0.0.1:54322/postgres
