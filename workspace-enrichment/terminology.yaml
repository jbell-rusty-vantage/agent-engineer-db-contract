format: ai-engineer-workspace-enrichment/1
terms:
  - slug: knowledge-continuum
    term: knowledge continuum
    aliases: [L1, L2, L3, L4, levels, continuum]
    definition: The four answer levels every question routes through. L1 catalog tables (api.models, api.software, …) filter, compare and rank without embeddings; L2 facts and time (api.changes_since, api.price_history, api.fact_locators, api.entity_at) answer what was true when and where it was read; L3 scoped semantic search (api.search_unified, api.talk_segments, api.document_units, api.document_digest) finds passages inside a scope; L4 is a budgeted agent loop over L1–L3 that files its result as a report.
    refs: [api.models, api.changes_since, api.search_unified, task:compare-models]
    provenance: model_assisted
    reviewed: null
  - slug: lens
    term: lens
    aliases: [whose knowledge, lens facet]
    definition: Whose knowledge a row is. corpus is ingested industry knowledge (catalog, content, temporal, taxonomy, staging, acquisition, ranking, guidance, retrieval, the api catalog views); ours is what we author and learn (authoring, learning, access, library, inquiry, dataset, product, api.works_authored); private is one workspace's passages and conversations (RLS-isolated); evidence is claims, locators and admissions; machinery and legacy are runtime plumbing hidden from START_HERE and MAP. Every search-index entry and page carries a lens; retrieval.vector_item.lens and api.search_unified p_lenses use the same words.
    refs: [retrieval.vector_item, api.search_unified]
    provenance: model_assisted
    reviewed: null
  - slug: source-tier
    term: source tier
    aliases: [tier, T0, T1, T2, T3, T4, authority tier]
    definition: A filter and a mild ranking boost, never a truth claim. T0 verified assertions, T1 our own content, T2 primary corpus (first party about itself, filers, registries), T3 third-party corpus, T4 live web. content.source_role.default_source_tier seeds it from who speaks; retrieval.vector_item.source_tier carries it; api.search_unified p_tiers filters on it.
    refs: [retrieval.vector_item, content.source_role, api.search_unified]
    provenance: model_assisted
    reviewed: null
  - slug: typed-unit
    term: typed unit
    aliases: [unit, document unit, node, document_node]
    definition: A content.document_node with a unit_kind from the content.unit_kind grammar (price_row, transcript_segment, release_entry, table_row, slide, section, …), attributes validated by that kind's JSON Schema, a logical_key stable across captures and a typed position (offsets, page, bbox, timecodes). Units are the anchors for locators, entity roles, extraction records and retrieval items; chunks are derived from units, never the other way round.
    refs: [content.document_node, content.unit_kind, q:content.document_units]
    provenance: model_assisted
    reviewed: null
  - slug: logical-key
    term: logical key
    aliases: [logical_key, grammar logical key]
    definition: unit_kind plus the values of the kind's logical_key_attributes (for a price_row offering|meter|tier|region), so the same unit can be matched across versions of a document. content.unit_change diffs versions by logical key; api.changes_since reports those diffs beside fact changes.
    refs: [content.document_node, content.unit_kind, content.unit_change]
    provenance: model_assisted
    reviewed: null
  - slug: census
    term: census
    aliases: [structure census, structural census]
    definition: "content.structure_census records what a captured representation structurally contains (headings, tables, lists, code, timecodes, speakers, figures, machine blocks) before any document kind or grammar is assigned. Kinds are open-world: a document_type can be candidate until its grammar settles, and promotion candidates come from census statistics."
    refs: [content.structure_census, content.document_type, content.document_kind_assignment]
    provenance: model_assisted
    reviewed: null
  - slug: digest
    term: digest
    aliases: [document digest, structured digest, digest item]
    definition: content.document_digest is a structured digest of a document version (or a section/entity view) whose content.digest_item rows are records anchored to unit node ids — key points, entity roles, assertion references, changes, open questions, limitations, research directions. Prose summaries in content.document_summary render a digest; prose without a digest is not evidence.
    refs: [content.document_digest, content.digest_item, content.document_summary, q:content.document_digest]
    provenance: model_assisted
    reviewed: null
  - slug: assertion-mapping
    term: assertion mapping
    aliases: [unit assertion mapping, act 3, mapping]
    definition: content.unit_assertion_mapping declares how a unit kind's attributes become an assertion (a stream kind, relationship, event or attribute) with subject, value, qualifier and time templates. Deterministic mappings on first-party structured units take the cheap path; others carry a risk floor and go through Knowledge Services verification. evidence.extraction_record records which mapping interpreted which unit.
    refs: [content.unit_assertion_mapping, content.unit_kind, evidence.extraction_record]
    provenance: model_assisted
    reviewed: null
  - slug: knowledge-head
    term: knowledge head
    aliases: [head, knowledge_seq, K]
    definition: Per-tenant monotonic sequence of sealed knowledge batches. Every snapshot and ingestion intent cites it; begin_batch fails rebase_required when the expected head does not match.
    refs: [temporal.knowledge_head, temporal.begin_batch, q:knowledge.head]
    provenance: model_assisted
    reviewed: null
  - slug: knowledge-batch
    term: knowledge batch
    aliases: [batch, sealed batch]
    definition: One committed admission transaction. commit_batch writes a knowledge_batch row with a receipt, idempotency key, and input digest, then advances the tenant head by one.
    refs: [temporal.knowledge_batch, temporal.commit_batch, temporal.begin_batch]
    provenance: model_assisted
    reviewed: null
  - slug: segment
    term: segment
    aliases: [fact, temporal fact, state segment]
    definition: One assertion of a fact on a stream. Carries a world interval valid_during and a knowledge interval [k_from, k_to). Current means k_to is null.
    refs: [temporal.segment, temporal.assert_state, q:facts.current_by_stream]
    provenance: model_assisted
    reviewed: null
  - slug: stream
    term: stream
    aliases: [fact series, stream slot]
    definition: The identity of a fact series, unique on (kind, subject entity or relationship, scope_key). Segments stack on a stream; overlapping current segments are forbidden.
    refs: [temporal.stream, temporal.stream_kind, q:facts.history_for_stream]
    provenance: model_assisted
    reviewed: null
  - slug: extent
    term: extent
    aliases: [date extent, temporal extent]
    definition: Source text for a date with precision (instant, day, month, quarter, year, relative, unknown) and optional earliest/latest bounds. Required when temporal_basis is explicit or carry_forward.
    refs: [temporal.extent, temporal.make_extent]
    provenance: model_assisted
    reviewed: null
  - slug: world-time
    term: world time
    aliases: [valid_during, occurred_during, as-of date]
    definition: When the world was like this. Stored as a tstzrange bounded below with [) bounds. Distinct from when we came to know it.
    refs: [temporal.segment, q:entity.at]
    provenance: model_assisted
    reviewed: null
  - slug: knowledge-time
    term: knowledge time
    aliases: [k_from, k_to, knowledge interval, learned_at]
    definition: When a fact was admitted or closed. Stamped from the open batch. Current rows have k_to null; closed rows keep history. api.changes_since reports learned_at beside world_from.
    refs: [temporal.segment, temporal.stamp_k, q:entity.what_changed, q:facts.changes_since]
    provenance: model_assisted
    reviewed: null
  - slug: two-clocks
    term: two clocks
    aliases: [bitemporal, two-clock]
    definition: World time and knowledge time together. entity.at(entity, T, K) answers what was true at T as we knew it at K; price_history shows every belief with both clocks.
    refs: [temporal.segment, q:entity.at, q:facts.price_history, q:knowledge.head]
    provenance: model_assisted
    reviewed: null
  - slug: canonical-entity
    term: canonical entity
    aliases: [entity, identity row]
    definition: One row in catalog.entity. kind picks the taxonomy.entity_kind whose attributes_schema validates the row's attributes jsonb. lifecycle is active, merged, or retired. Numbers that change over time are fact streams, never attributes.
    refs: [catalog.entity, taxonomy.entity_kind, q:entity.resolve, q:entity.attributes]
    provenance: model_assisted
    reviewed: null
  - slug: work
    term: work
    aliases: [published work, catalog work, bibliographic row]
    definition: catalog.work is the bibliographic row behind an entity whose kind is a work (paper, talk, media work, story, case study; taxonomy.entity_kind.is_work). Its content lives in content.document rows that point back through work_entity_id.
    refs: [catalog.work, content.document, q:catalog.talks, q:catalog.papers]
    provenance: model_assisted
    reviewed: null
  - slug: alias
    term: alias
    aliases: [entity alias, synonym]
    definition: A typed alternate name (synonym, acronym, former_name, handle, ticker, slug, misspelling, translation, model_alias). Unique per (entity, normalized alias, alias_kind), not globally unique across entities.
    refs: [catalog.entity_alias, q:entity.resolve]
    provenance: model_assisted
    reviewed: null
  - slug: identifier
    term: identifier
    aliases: [external id, scheme]
    definition: A schemed external identifier. scheme is a closed check-constraint vocabulary. Unique per tenant on (scheme, value), so one identifier names at most one entity.
    refs: [catalog.entity_identifier, q:entity.by_identifier]
    provenance: model_assisted
    reviewed: null
  - slug: support
    term: support
    aliases: [segment support, admitted support]
    definition: A k-stamped link from a claim and locator to a segment or event occurrence. Written only through temporal.admit_support inside an open batch.
    refs: [evidence.segment_support, temporal.admit_support, q:evidence.claim_support]
    provenance: model_assisted
    reviewed: null
  - slug: claim
    term: claim
    aliases: [evidence claim]
    definition: An atomic statement with claim_type, status, and created_by_receipt_id. Facts may cite a claim as primary_claim_id. Subjects are attached via claim_subject roles subject, object, or context.
    refs: [evidence.claim, evidence.claim_subject, q:evidence.claims_for_entity]
    provenance: model_assisted
    reviewed: null
  - slug: evidence-packet
    term: evidence packet
    aliases: [packet]
    definition: A retrieval-assembled bundle of members (verified claims, guidance items, source-faithful representations with scores and locators) for one question. Read with api.evidence_packet.
    refs: [retrieval.evidence_packet, retrieval.packet_member, q:retrieval.evidence_packet]
    provenance: model_assisted
    reviewed: null
  - slug: assurance
    term: assurance
    aliases: [assurance level, assurance_rank]
    definition: How strongly a guidance item or vector item is backed. guidance.assurance_level is the vocabulary; retrieval filters accept a minimum assurance rank.
    refs: [guidance.assurance_level, guidance.item, retrieval.vector_item]
    provenance: model_assisted
    reviewed: null
  - slug: guidance-item
    term: guidance item
    aliases: [expert item, engineering record, knowledge record]
    definition: guidance.item is one expert knowledge statement typed by guidance.item_kind (technical_problem, solution_pattern, failure_mode, compatibility_constraint, operational_practice, implementation_example, security_consideration, advanced_usage_pattern, setup_guide_step, research_direction) with a payload validated by that kind's schema, an assurance level, a provenance claim and the entities it is about (guidance.item_subject). Created only under a receipt.
    refs: [guidance.item, guidance.item_kind, guidance.item_subject, q:guidance.items]
    provenance: model_assisted
    reviewed: null
  - slug: admission
    term: admission
    aliases: [admit, admitted, use admission]
    definition: Executor decision that a proposal becomes a canonical fact through the temporal helpers. A verified claim's receipt must name an admitted use decision, recorded in verification.use_admission by verification.assert_admitted_use in the same transaction. Distinct from receipt outcome applied and from plan outcomes such as review_required or held.
    refs: [temporal.assert_state, temporal.commit_batch, verification.use_admission, verification.assert_admitted_use]
    provenance: model_assisted
    reviewed: null
  - slug: staging-candidate
    term: staging candidate
    aliases: [candidate]
    definition: An unresolved proposed identity. Not a staging copy of a fact. Resolution decisions are create, match, reject, or defer; vetting decisions are admit, reject, or defer.
    refs: [staging.candidate, staging.resolution_decision, q:staging.unresolved]
    provenance: model_assisted
    reviewed: null
  - slug: receipt
    term: receipt
    aliases: [operation receipt]
    definition: Immutable orchestration.operation_receipt for one intent. Outcome is applied, rejected, noop, or partial. Facts and entities require a receipt id before they can be written.
    refs: [orchestration.operation_receipt, orchestration.operation_intent, q:receipts.for_intent]
    provenance: model_assisted
    reviewed: null
  - slug: artifact
    term: artifact
    aliases: [stored artifact]
    definition: Content-addressed stored object (sha256, bucket_class, storage_bucket, object_path) typed by artifact_type. Lineage edges record derived_from, supersedes, corrects, produced_by, consumed_by.
    refs: [orchestration.artifact, orchestration.artifact_lineage, q:artifacts.by_type]
    provenance: model_assisted
    reviewed: null
  - slug: intent
    term: intent
    aliases: [operation intent]
    definition: A durable proposed operation. knowledge-read-intent.v1 and knowledge-ingestion-intent.v1 are the workspace contracts; the ledger row is orchestration.operation_intent with an idempotency_key.
    refs: [orchestration.operation_intent, orchestration.intent_type]
    provenance: model_assisted
    reviewed: null
  - slug: idempotency-key
    term: idempotency key
    aliases: [idempotencyKey]
    definition: Unique per tenant on operation_intent, knowledge_batch and authoring.command (product operations). A second submit of the same bytes returns the existing receipt or result; the same key with different input is CONFLICT.
    refs: [orchestration.operation_intent, temporal.knowledge_batch, authoring.command]
    provenance: model_assisted
    reviewed: null
  - slug: rebase-required
    term: rebase_required
    aliases: [REBASE_REQUIRED, stale head]
    definition: Transaction failure (SQLSTATE 40001) from begin_batch when expected head does not match the locked knowledge_head. Not a per-proposal outcome.
    refs: [temporal.begin_batch, temporal.knowledge_head, q:entity.what_changed]
    provenance: model_assisted
    reviewed: null
  - slug: vocabulary
    term: vocabulary
    aliases: [reference data, kind table]
    definition: Allowlisted code tables such as taxonomy.entity_kind, taxonomy.relationship_kind, temporal.stream_kind, content.document_type, content.unit_kind, content.format, content.source_role and guidance.item_kind. Slot rules and endpoint kinds are enforced at write time.
    refs: [taxonomy.entity_kind, taxonomy.relationship_kind, temporal.stream_kind, content.unit_kind, q:vocab.stream_kind]
    provenance: model_assisted
    reviewed: null
  - slug: entity-kind
    term: entity kind
    aliases: [kind]
    definition: taxonomy.entity_kind.code. Carries attributes_schema (validates catalog.entity.attributes), parent_kind (model version -> model; the link itself is a catalog.relationship) and is_work. catalog.entity.kind is a foreign key; unknown kinds cannot be inserted.
    refs: [taxonomy.entity_kind, catalog.entity]
    provenance: model_assisted
    reviewed: null
  - slug: relationship-kind
    term: relationship kind
    aliases: [rel kind]
    definition: taxonomy.relationship_kind.code with from_kinds, to_kinds, temporal flag, and property_schema. Trigger catalog.check_relationship_kinds rejects illegal endpoints.
    refs: [taxonomy.relationship_kind, catalog.relationship, q:vocab.relationship_kind]
    provenance: model_assisted
    reviewed: null
  - slug: stream-kind
    term: stream kind
    aliases: [fact kind]
    definition: temporal.stream_kind.code with subject_mode, subject_kinds, status_values, unit_values, requires_amount, and payload_schema. commit_batch validates slot rules. offering_price is the one home for prices (payload meter|tier|region), benchmark_score the one home for benchmark numbers.
    refs: [temporal.stream_kind, q:vocab.stream_kind]
    provenance: model_assisted
    reviewed: null
  - slug: meter
    term: meter
    aliases: [price meter, input_tokens, output_tokens]
    definition: The thing an offering price is charged per (input_tokens, output_tokens, cached_input_tokens, batch_input_tokens, …). Required in the offering_price payload; with tier and region it forms the price series scope_key, and api.price_history takes it as p_meter.
    refs: [temporal.stream_kind, q:facts.price_history, api.model_offerings]
    provenance: model_assisted
    reviewed: null
  - slug: scope-key
    term: scope key
    aliases: [scopeKey, scope]
    definition: Distinguishes parallel series on the same subject and stream kind (meter|tier|region for prices, episode for engagements). Default is the empty string. Part of the stream unique key; the database enforces no naming convention, so a correction must reuse the existing series key.
    refs: [temporal.stream, temporal.assert_state]
    provenance: model_assisted
    reviewed: null
  - slug: tenant
    term: tenant
    aliases: [tenant_id]
    definition: Isolation key read from GUC app.tenant_id by util.current_tenant_id(). Missing context fails closed. RLS policies compare tenant_id to that function.
    refs: [util.current_tenant_id]
    provenance: model_assisted
    reviewed: null
  - slug: role
    term: role
    aliases: [bounded role]
    definition: NOLOGIN Postgres roles. app_reader sees api views and RPCs. pipeline_agent selects bounded schemas. executor_service alone executes temporal helpers and writes catalog facts. Product operations run as authenticated (api.product_command / api.product_read) or service_role (api.product_worker).
    refs: [api.entities, temporal.assert_state, api.product_command]
    provenance: model_assisted
    reviewed: null
  - slug: rls
    term: RLS
    aliases: [row level security]
    definition: Enabled on tenant tables. Typical policy km_tenant_access uses tenant_id = util.current_tenant_id(). Private-lens rows (library.passage, conversation.*) are additionally isolated per workspace; api.search_unified returns them only for the workspaces passed in.
    refs: [util.current_tenant_id, library.passage]
    provenance: model_assisted
    reviewed: null
  - slug: fingerprint
    term: fingerprint
    aliases: [workspace fingerprint, sha256]
    definition: Digest of schema structure plus vocabularies, or of workspace plus enrichment. Artifacts also carry content sha256. Ingestion intents cite workspaceFingerprint; mismatch is WORKSPACE_STALE.
    refs: [orchestration.artifact]
    provenance: model_assisted
    reviewed: null
  - slug: workspace
    term: workspace
    aliases: [schema workspace]
    definition: Generated projection of schema-ir.v1 into Markdown layers, search indexes, operation pages and the named-query catalog. Agents search then read a domain or task page; they never read schema-ir.json whole. Not to be confused with authoring.workspace, the product's team container.
    refs: [authoring.workspace]
    provenance: model_assisted
    reviewed: null
  - slug: domain
    term: domain
    aliases: [L1 domain]
    definition: A curated map of 5–20 relations that belong together (identity, temporal-facts, content, …). Default domain for a schema is schema_domains; a relation overlay may override it.
    refs: []
    provenance: model_assisted
    reviewed: null
  - slug: task
    term: task
    aliases: [task page]
    definition: A question family with navigation, a read or ingestion operation, expected shape, and pitfalls. The shortest path from a natural-language question to a valid catalog query, product operation or intent.
    refs: []
    provenance: model_assisted
    reviewed: null
  - slug: operation
    term: operation
    aliases: [product operation, op, dispatch]
    definition: One `when '<op>' then` arm of product.dispatch_command / dispatch_read / dispatch_worker / dispatch_research_*, called through api.product_command(workspace, op, idempotency_key, expected_head, payload), api.product_read or api.product_worker. Each has a page under ops/ listing the relations the arm touches.
    refs: [api.product_command, api.product_read, api.product_worker, product.dispatch_command]
    provenance: model_assisted
    reviewed: null
  - slug: named-query
    term: named query
    aliases: [catalog query]
    definition: An entry in the knowledge-query-catalog. Agents pass a name and params; they never send SQL. Build validation executes each example under the catalog role.
    refs: [q:entity.resolve, q:knowledge.head]
    provenance: model_assisted
    reviewed: null
  - slug: cost-class
    term: cost class
    aliases: [cheap, medium, heavy]
    definition: Catalog hint for statement_timeout and EXPLAIN gates. cheap and medium default to 15s; heavy is 60s and must not sequential-scan large relations.
    refs: [q:retrieval.search_unified]
    provenance: model_assisted
    reviewed: null
  - slug: hybrid-search
    term: hybrid search
    aliases: [RRF, fused search]
    definition: api.search_unified fuses english full-text, trigram and (when an embedding is given) ANN channels with reciprocal rank fusion over the one stack, filtered by lens, tier, space, document kind, unit kind, entity, as-of and workspace. api.hybrid_knowledge_search_1536 is the older per-space-version entry.
    refs: [api.search_unified, api.hybrid_knowledge_search_1536, q:retrieval.search_unified]
    provenance: model_assisted
    reviewed: null
  - slug: vector-space
    term: vector space
    aliases: [space, embedding space, space slug]
    definition: A named retrieval space (units, digests, entity_cards, assertions, own_content, learner_notes, knowledge_text, …) with versions and publications. api.search_unified takes space slugs as a facet; agents read only published versions.
    refs: [retrieval.vector_space, retrieval.space_publication, retrieval.vector_item]
    provenance: model_assisted
    reviewed: null
  - slug: projection
    term: projection
    aliases: [search projection, index_text_item]
    definition: A derived retrieval object (search_projection, vector_item) pointing at a projection_target (entity card, guidance item, chunk, claim, summary, typed unit, digest, our authored revision or a private passage). retrieval.index_text_item is the one way a text becomes searchable; agents never write embeddings.
    refs: [retrieval.search_projection, retrieval.projection_target, retrieval.vector_item, retrieval.index_text_item]
    provenance: model_assisted
    reviewed: null
  - slug: publication
    term: publication
    aliases: [space publication]
    definition: A published vector-space version that search is allowed to read. Unpublished or inactive versions raise insufficient_privilege.
    refs: [retrieval.space_publication, api.hybrid_knowledge_search_1536]
    provenance: model_assisted
    reviewed: null
  - slug: mission
    term: mission
    aliases: [orchestration mission]
    definition: orchestration.mission is the durable work envelope. Intents, artifacts and acquisition.fetch rows may record mission ids. Mission Control admission is out of band; this workspace only stores the id when supplied.
    refs: [orchestration.mission, orchestration.operation_intent, q:receipts.recent_for_mission]
    provenance: model_assisted
    reviewed: null
  - slug: verification-run
    term: verification run
    aliases: [sealed run]
    definition: A knowledge_verification component run that must be sealed before cited claims may be materialized; the database records the admitted use in verification.use_admission and a verified claim names an admission-bound receipt.
    refs: [verification.use_admission, evidence.claim]
    provenance: model_assisted
    reviewed: null
  - slug: locator
    term: locator
    aliases: [quote, selector]
    definition: A precise selection inside a capture (text_quote, table cell, media_timecode, page+bbox, JSON pointer, line range) with selected_content_sha256 and a normalized value. Support rows require a locator; api.fact_locators shows the locator, capture and typed unit behind a current fact.
    refs: [evidence.locator, evidence.source_capture, q:facts.locators]
    provenance: model_assisted
    reviewed: null
  - slug: fetch
    term: fetch
    aliases: [acquisition fetch, fetch ledger]
    definition: acquisition.fetch is one attempt to obtain bytes from a URL — who (origin), with what tool, outcome, hash, spend — recorded before it becomes an evidence.source_capture. outcome unchanged means the same bytes as prior_capture_id, so no new document version; content.refresh_check records that per document.
    refs: [acquisition.fetch, evidence.source_capture, content.refresh_check, q:acquisition.fetches_for_url]
    provenance: model_assisted
    reviewed: null
  - slug: temporal-basis
    term: temporal basis
    aliases: [temporal_basis]
    definition: Why the world interval is believed. explicit and carry_forward require an extent; observation_bounded is “true at capture time”; unresolved is an admitted gap.
    refs: [temporal.segment, temporal.extent]
    provenance: model_assisted
    reviewed: null
  - slug: belief
    term: belief
    aliases: [accepted, disputed]
    definition: accepted, disputed, or unknown on a segment or occurrence. disputed does not replace an accepted current segment; the executor plans review_required.
    refs: [temporal.segment, temporal.event_occurrence]
    provenance: model_assisted
    reviewed: null
  - slug: head-revision
    term: head revision
    aliases: [expected head, work head, revision]
    definition: authoring.work.head_revision_id, the current immutable authoring.work_revision of a course, module, lesson, activity, brief, report or dataset. Commands that change a work pass p_expected_head; a stale head is CONFLICT. api.works_authored lists works at their head.
    refs: [authoring.work, authoring.work_revision, api.works_authored]
    provenance: model_assisted
    reviewed: null
  - slug: release
    term: release
    aliases: [frozen release, software release]
    definition: Two meanings. authoring.release freezes a root revision's closure for distribution (freeze_release, offer_release); a software release in the corpus is a library_release entity whose release_published event and version facts api.software_releases lists, and api.modules_affected_by_release connects the two.
    refs: [authoring.release, api.software_releases, api.modules_affected_by_release]
    provenance: model_assisted
    reviewed: null
