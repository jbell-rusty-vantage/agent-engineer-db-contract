  limit: 200
  maxLimit: 2000
  statementTimeoutMs: { cheap: 15000, medium: 15000, heavy: 60000 }
queries:
  # ---------------------------------------------------------------- identity
  - name: entity.resolve
    title: Find entities by name, alias, or identifier
    kind: named_query
    role: app_reader
    sql: select * from api.resolve_entity($1::text)
    paramOrder: [text]
    params:
      type: object
      required: [text]
      properties:
        text: { type: string, minLength: 1 }
      additionalProperties: false
    result: { shape: rows, columns: [entity_id, kind, display_name, score] }
    cost_class: cheap
    temporal: { world_time: n/a, knowledge: head }
    pagination: null
    volatile: false
    domain: identity
    tasks: [what-do-we-know-about-entity, resolve-or-create-entity, compare-models, price-with-locator]
    aliases: [resolve, lookup]
    example: { text: OpenAI }
    execute: true
    provenance: model_assisted
    reviewed: null

  - name: entity.card
    title: Current overview of one entity
    kind: named_query
    role: app_reader
    sql: select api.entity_card($1::uuid) as card
    paramOrder: [entity_id]
    params:
      type: object
      required: [entity_id]
      properties:
        entity_id: { type: string, format: uuid, pgType: uuid }
      additionalProperties: false
    result: { shape: single_json, columns: [card] }
    cost_class: cheap
    temporal: { world_time: now(), knowledge: head }
    pagination: null
    volatile: false
    domain: identity
    tasks: [what-do-we-know-about-entity]
    aliases: [card, overview]
    example: { entity_id: "0192b000-0000-7000-8000-000000000001" }
    execute: true
    provenance: model_assisted
    reviewed: null

  - name: entity.by_identifier
    title: Find a canonical entity by external identifier scheme and value
    kind: named_query
    role: pipeline_agent
    sql: |
      select e.id as entity_id, e.kind, e.display_name, e.lifecycle, i.scheme, i.value
      from catalog.entity_identifier i
      join catalog.entity e on e.id = i.entity_id and e.tenant_id = i.tenant_id
      where i.tenant_id = util.current_tenant_id()
        and i.scheme = $1
        and i.value = $2
    paramOrder: [scheme, value]
    params:
      type: object
      required: [scheme, value]
      properties:
        scheme: { type: string, minLength: 1 }
        value: { type: string, minLength: 1 }
      additionalProperties: false
    result: { shape: rows, columns: [entity_id, kind, display_name, lifecycle, scheme, value] }
    cost_class: cheap
    temporal: { world_time: n/a, knowledge: head }
    pagination: null
    volatile: false
    domain: identity
    tasks: [find-entity-by-identifier, resolve-or-create-entity]
    aliases: [identifier, scheme lookup]
    example: { scheme: github, value: openai/openai-python }
    execute: true
    provenance: model_assisted
    reviewed: null

  - name: entity.attributes
    title: Canonical entity row with its kind-validated attributes and the kind's attribute schema
    kind: named_query
    role: pipeline_agent
    sql: |
      select e.id as entity_id, e.kind, e.display_name, e.slug, e.lifecycle, e.summary, e.attributes,
             ek.parent_kind, ek.is_work, ek.attributes_schema
      from catalog.entity e
      join taxonomy.entity_kind ek on ek.code = e.kind
      where e.tenant_id = util.current_tenant_id()
        and e.id = $1
        and ($2::text is null or e.kind = $2)
    paramOrder: [entity_id, kind]
    params:
      type: object
      required: [entity_id]
      properties:
        entity_id: { type: string, format: uuid, pgType: uuid }
        kind: { type: ["string", "null"], default: null }
      additionalProperties: false
    result: { shape: single_row, columns: [entity_id, kind, display_name, slug, lifecycle, summary, attributes, parent_kind, is_work, attributes_schema] }
    cost_class: cheap
    temporal: { world_time: n/a, knowledge: head }
    pagination: null
    volatile: false
    domain: identity
    tasks: [what-do-we-know-about-entity, resolve-or-create-entity, find-entity-by-identifier]
    aliases: [attributes, typed row, kind row]
    example: { entity_id: "0192b000-0000-7000-8000-000000000001", kind: organization }
    execute: true
    provenance: model_assisted
    reviewed: null

  # ---------------------------------------------------------------- L1 catalog views
  - name: catalog.models
    title: L1 models (one row per model version) with developer, capabilities, availability and minimum current price
    kind: named_query
    role: app_reader
    sql: |
      select * from api.models
      where ($1::text is null or model ilike '%' || $1 || '%' or developer ilike '%' || $1 || '%' or model_family ilike '%' || $1 || '%')
        and ($2::text is null or availability = $2)
      order by released_on desc nulls last, model
      limit least(greatest(coalesce($3, 50), 1), 200)
    paramOrder: [text, availability, limit]
    params:
      type: object
      properties:
        text: { type: ["string", "null"], default: null }
        availability: { type: ["string", "null"], default: null }
        limit: { type: integer, minimum: 1, maximum: 200, default: 50 }
      additionalProperties: false
    result: { shape: rows, columns: [model_version_id, model, developer, released_on, context_tokens, max_output_tokens, modalities, tool_use, structured_output, reasoning, vision, open_weights, knowledge_cutoff, availability, min_input_usd_per_1m, min_output_usd_per_1m, offering_count, as_of_knowledge_seq] }
    cost_class: medium
    temporal: { world_time: now(), knowledge: head }
    pagination: { kind: limit, limitParam: limit }
    volatile: false
    domain: api-surface
    tasks: [compare-models, cheapest-qualified-model]
    aliases: [models, compare models, model table]
    example: { text: null, availability: null, limit: 50 }
    execute: true
    provenance: model_assisted
    reviewed: null

