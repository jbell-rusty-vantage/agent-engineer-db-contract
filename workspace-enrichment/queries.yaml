        and ($2::text is null or provider ilike '%' || $2 || '%' or model ilike '%' || $2 || '%' or offering ilike '%' || $2 || '%')
      order by input_usd_per_1m nulls last, offering
      limit least(greatest(coalesce($3, 50), 1), 200)
    paramOrder: [model_version_id, text, limit]
    params:
      type: object
      properties:
        model_version_id: { type: ["string", "null"], format: uuid, pgType: uuid, default: null }
        text: { type: ["string", "null"], default: null }
        limit: { type: integer, minimum: 1, maximum: 200, default: 50 }
