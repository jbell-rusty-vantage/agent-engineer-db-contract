    sql: |
      select s.id as sweep_id, p.slug as policy, s.trigger_kind, s.origin_kind, s.mission_id, s.trigger_ref ->> 'mc_run_id' as mc_run_id,
             s.started_at, s.note, p.budget_usd_per_run
      from acquisition.attention_sweep s
