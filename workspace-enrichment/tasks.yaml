format: ai-engineer-workspace-enrichment/1
tasks:
  # ---------------------------------------------------------------- loop-1 question shapes
  - slug: compare-models
    title: Compare models on capabilities, context, price and benchmarks
    domains: [api-surface, ranking, temporal-facts]
    queries: [catalog.models, catalog.benchmark_scores, catalog.model_offerings, ranking.leaderboard, catalog.models_at]
    aliases: [compare models, which model, model comparison, best model for]
    navigation: |
      `START_HERE.md` (L1) → `relations/api/models.md` → `q:catalog.models`; numbers you quote go back to `q:catalog.benchmark_scores` / `q:facts.locators`.
    operation: |
      One L1 read answers most comparisons; add benchmarks and a leaderboard when ranking matters.

      ```json
      {
        "schemaVersion": "knowledge-read-intent.v1",
        "intentId": "compare-frontier-models",
        "operations": [
          { "opId": "models", "kind": "named_query", "query": "catalog.models", "params": { "text": null, "availability": "ga", "limit": 100 } },
          { "opId": "scores", "kind": "named_query", "query": "catalog.benchmark_scores", "params": { "subject_id": null, "benchmark": "SWE-bench", "limit": 100 } },
          { "opId": "board", "kind": "named_query", "query": "ranking.leaderboard", "params": { "slug": "cheapest-frontier-input", "limit": 20 } }
        ]
      }
      ```

      For "as of last June" replace `catalog.models` with `q:catalog.models_at` (`at`).
    expected_shape: |
      `models` rows: one per model version with `developer`, `released_on`, `context_tokens`, `max_output_tokens`, `modalities`, capability statuses (`tool_use`, `structured_output`, `reasoning`, `vision`), `knowledge_cutoff`, `availability`, `min_input_usd_per_1m`, `min_output_usd_per_1m`, `offering_count`, `as_of_knowledge_seq`. `scores` rows carry `score`, `unit`, `setting`, `claim_id`. A leaderboard row carries `source_segment_ids` in `explanation`.
    pitfalls: |
      `api.models` shows the minimum current price across offerings; the offering that has it is in `q:catalog.model_offerings` (`model_version_id`). Capability columns are statuses of fact streams, not booleans from a spec sheet; `null` means no fact, not "no". Cite `as_of_knowledge_seq` with every table you paste. Do not rank by benchmark without the `setting` column — two scores with different settings are not comparable.
    provenance: model_assisted
    reviewed: null

  - slug: price-with-locator
    title: What does X cost per 1M tokens, and where exactly was that read?
    domains: [api-surface, temporal-facts, evidence]
    queries: [entity.resolve, catalog.model_offerings, facts.price_history, facts.locators, content.document_units]
    aliases: [price, pricing, cost per token, citation for price, where does the price come from]
    navigation: |
      `tasks/compare-models.md` or `q:entity.resolve` → `q:catalog.model_offerings` → `q:facts.locators` (`api.fact_locators`) → optionally `q:content.document_units`.
    operation: |
      ```json
      {
        "schemaVersion": "knowledge-read-intent.v1",
        "intentId": "price-with-locator",
        "operations": [
          { "opId": "resolve", "kind": "named_query", "query": "entity.resolve", "params": { "text": "GPT-5.6 (API)" } },
          { "opId": "offer", "kind": "named_query", "query": "catalog.model_offerings", "params": { "model_version_id": null, "text": "GPT-5.6", "limit": 20 } },
          { "opId": "history", "kind": "named_query", "query": "facts.price_history", "params": { "offering_id": "$offer.rows[0].offering_id", "meter": "input_tokens" } },
          { "opId": "where", "kind": "named_query", "query": "facts.locators", "params": { "entity_id": "$offer.rows[0].offering_id", "stream_kind": "offering_price", "scope_key": null } }
        ]
      }
      ```
    expected_shape: |
      `offer` rows: `input_usd_per_1m`, `output_usd_per_1m`, `cached_input_usd_per_1m`, `batch_input_usd_per_1m`, `price_valid_from`, `price_observed_at`, `price_claim_id`, `price_locator_id`. `where` rows: the current fact plus `claim_statement`, `selector_kind`, `selector`, `normalized_value`, `request_url`, `captured_at`, and the typed unit (`unit_kind` price_row, `logical_key` like `price_row:gpt-5.6|input_tokens|standard|global`). `history` rows: every belief with `valid_during`, `k_from`/`k_to`, `learned_at`, `retracted_at`.
    pitfalls: |
      The offering is the subject of the price, not the model. `scope_key` is `meter|tier|region`; pass `null` to see every meter. A row in `history` with `k_to` set is a superseded belief — quote the current one unless the question is about history. `normalized_value` is the number as read; `amount` is normalized to USD per 1M tokens — say which you cite.
    provenance: model_assisted
    reviewed: null

  - slug: what-changed-since
    title: What changed since <date> (facts, events, refreshed documents)?
    domains: [temporal-facts, content, acquisition]
    queries: [facts.changes_since, content.unit_changes, content.refresh_checks, catalog.models_at, catalog.model_offerings_at]
    aliases: [changes since, what's new, delta since date, recent changes, refresh results]
    navigation: |
      `START_HERE.md` (L2) → `functions/api/changes_since.md` → `q:facts.changes_since`; for the document side `q:content.unit_changes` and `q:content.refresh_checks`.
    operation: |
      ```json
      {
        "schemaVersion": "knowledge-read-intent.v1",
        "intentId": "changes-since-october",
        "operations": [
          { "opId": "changes", "kind": "named_query", "query": "facts.changes_since", "params": { "since": "2026-10-01T00:00:00Z", "stream_kinds": ["offering_price", "model_availability"], "entity_kinds": null, "document_types": ["pricing_page", "release_notes"] } },
          { "opId": "units", "kind": "named_query", "query": "content.unit_changes", "params": { "document_id": null, "since": "2026-10-01T00:00:00Z", "limit": 100 } },
          { "opId": "refresh", "kind": "named_query", "query": "content.refresh_checks", "params": { "document_id": null, "outcome": "changed", "limit": 50 } }
        ]
      }
      ```

      To see a whole table as it stood before the change, use `q:catalog.models_at` / `q:catalog.model_offerings_at` with `at` = the date.
    expected_shape: |
      `changes` rows: `change_source` (fact | event | document), `change_kind` (opened | replaced | …), `learned_at` and `knowledge_seq` (knowledge clock), `world_from` (world clock), `subject`, `stream_kind`, `scope_key`, `old_value`/`new_value`, and for documents `document_title`, `logical_key`, `unit_kind`, `changed_attributes`. `refresh` rows with `outcome = unchanged` are honest no-ops.
    pitfalls: |
      Two clocks: `since` is matched against `learned_at` (when we recorded it); a fact that *holds* since October but was learned later appears with its own `learned_at`. Unit changes are not yet facts — an `attribute_changed` price_row is an update proposal until an assertion mapping and a receipt turn it into a segment. Filter by `stream_kinds`/`document_types`; an unfiltered call over a busy tenant is large.
    provenance: model_assisted
    reviewed: null

  - slug: cheapest-qualified-model
    title: Cheapest model that satisfies a capability or benchmark floor
    domains: [api-surface, ranking]
    queries: [catalog.models, catalog.model_offerings, catalog.benchmark_scores, ranking.leaderboard]
    aliases: [cheapest, cost effective, budget model, cheapest with tool use]
    navigation: |
      `tasks/compare-models.md` → `q:catalog.models` (filter capabilities) → `q:catalog.model_offerings` (price per offering) → `q:catalog.benchmark_scores` (floor).
    operation: |
      Filter first, then price, then verify the floor; a leaderboard edition can replace all three when one exists.

      ```json
      {
        "schemaVersion": "knowledge-read-intent.v1",
        "intentId": "cheapest-with-tool-use",
        "operations": [
          { "opId": "models", "kind": "named_query", "query": "catalog.models", "params": { "text": null, "availability": "ga", "limit": 200 } },
          { "opId": "offers", "kind": "named_query", "query": "catalog.model_offerings", "params": { "model_version_id": null, "text": null, "limit": 200 } },
          { "opId": "scores", "kind": "named_query", "query": "catalog.benchmark_scores", "params": { "subject_id": null, "benchmark": "SWE-bench", "limit": 200 } },
          { "opId": "board", "kind": "named_query", "query": "ranking.leaderboard", "params": { "slug": "cheapest-frontier-input", "limit": 20 } }
        ]
      }
      ```

      Keep `models` rows where `tool_use = 'supported'` (or the status you need), join `offers` on `model_version_id` and take the lowest `input_usd_per_1m` whose subject has a `scores` row above the floor.
    expected_shape: |
      A short list ordered by `input_usd_per_1m` with the offering, provider, region/tier, the capability status that qualified it and the benchmark row (`score`, `setting`, `claim_id`) that met the floor. Cite `price_locator_id` and `as_of_knowledge_seq`.
    pitfalls: |
      Cheapest input is not cheapest overall: weigh `output_usd_per_1m` and cached/batch meters by your traffic. Capability statuses are per model version; offerings of the same version share them. A missing benchmark row means unknown, not failed. Leaderboard editions are snapshots at a knowledge head; recompute from L1 when the head has moved.
    provenance: model_assisted
    reviewed: null

  - slug: release-history
    title: Release history of a library, MCP server or model (what shipped when, breaking or not)
    domains: [api-surface, temporal-facts]
    queries: [catalog.software, catalog.software_releases, events.current_for_entity, facts.changes_since]
    aliases: [releases, changelog, version history, what shipped, breaking changes]
    navigation: |
      `q:catalog.software` (find `software_id`) → `q:catalog.software_releases` → for the event view `q:events.current_for_entity`.
    operation: |
      ```json
      {
        "schemaVersion": "knowledge-read-intent.v1",
        "intentId": "langgraph-releases",
        "operations": [
          { "opId": "sw", "kind": "named_query", "query": "catalog.software", "params": { "kind": "library", "text": "langgraph", "limit": 10 } },
          { "opId": "releases", "kind": "named_query", "query": "catalog.software_releases", "params": { "software_id": "$sw.rows[0].software_id", "text": null, "limit": 100 } },
          { "opId": "events", "kind": "named_query", "query": "events.current_for_entity", "params": { "entity_id": "$sw.rows[0].software_id" } }
        ]
      }
      ```
    expected_shape: |
      `releases` rows newest first: `release` (the library_release entity), `version_label`, `released_at`, `breaking`, `highlights`, `release_url`, `learned_k` (knowledge seq when we learned it), `observed_at`. `events` rows: `release_published`, `release_yanked`, `repo_*` occurrences with `occurred_during`.
    pitfalls: |
      A release is an entity (`library_release`, `version_of` the library); its date is a fact, its publication an event — the view folds them. `breaking` null means unknown, not false. `learned_k` later than `released_at` is normal (we learned about it later); order by `released_at` for history, by `learned_k` for "what did we learn recently" (or use `tasks/what-changed-since.md`). Models version the same way (`ai_model_version`, `model_version_released`), but their table is `q:catalog.models`.
    provenance: model_assisted
    reviewed: null

  - slug: talks-on-topic
    title: Which talks cover <topic>, who gave them, where?
    domains: [api-surface, content, retrieval]
    queries: [catalog.concepts, catalog.talks, retrieval.search_unified, content.document_digest]
    aliases: [talks about, sessions on, who spoke about, conference talks on]
    navigation: |
      `q:catalog.talks` (text matches title, topics, speakers) → for passages `q:retrieval.search_unified` with `document_types: [aie_talk]` → `q:content.document_digest` for the talk's digest.
    operation: |
      ```json
      {
        "schemaVersion": "knowledge-read-intent.v1",
        "intentId": "talks-context-engineering",
        "operations": [
          { "opId": "concept", "kind": "named_query", "query": "catalog.concepts", "params": { "text": "context engineering", "limit": 5 } },
          { "opId": "talks", "kind": "named_query", "query": "catalog.talks", "params": { "text": "context engineering", "event_id": null, "limit": 50 } },
          { "opId": "passages", "kind": "named_query", "query": "retrieval.search_unified", "params": { "query": "context engineering", "lenses": ["corpus"], "document_types": ["aie_talk"], "unit_kinds": ["transcript_segment", "slide"], "limit": 20 } },
          { "opId": "digest", "kind": "named_query", "query": "content.document_digest", "params": { "document_id": "$passages.rows[0].document_id" } }
        ]
      }
      ```
    expected_shape: |
      `talks` rows: `title`, `talk_kind`, `track`, `event`, `event_starts_on`, `speakers`, `speaker_affiliations`, `topics` (about edges), `repositories` (has_code), `video_url`, `slides_url`, `document_count`. `passages` rows: `snippet`, `start_ms`/`end_ms`, `document_id`, `unit_kind`, `fused_score`. `digest` rows: key points and entity roles anchored to `node_ids`.
    pitfalls: |
      `topics` come from `about` relationships to concept entities; a talk that mentions a topic only in its transcript appears in `passages`, not in `talks`. Without an embedding `search_unified` is lexical (full-text + trigram). Speaker is the talk's presenter unless a segment carries a speaker attribute; ai.engineer transcripts have none. Follow `tasks/talk-passage-at-timecode.md` to quote a passage.
    provenance: model_assisted
    reviewed: null

  - slug: talk-passage-at-timecode
    title: What was said in talk X between mm:ss and mm:ss (or where was Y said)?
    domains: [content, api-surface]
    queries: [catalog.talks, content.talk_segments, content.document_units, vocab.unit_kind]
    aliases: [timecode, transcript window, quote from talk, at minute, slide at]
    navigation: |
      `q:catalog.talks` (get `talk_id`) → `functions/api/talk_segments.md` → `q:content.talk_segments`.
    operation: |
      ```json
      {
        "schemaVersion": "knowledge-read-intent.v1",
        "intentId": "talk-window",
        "operations": [
          { "opId": "talk", "kind": "named_query", "query": "catalog.talks", "params": { "text": "Harness engineering", "event_id": null, "limit": 5 } },
          { "opId": "window", "kind": "named_query", "query": "content.talk_segments", "params": { "talk_id": "$talk.rows[0].talk_id", "from_ms": 600000, "to_ms": 720000, "query": null } },
          { "opId": "find", "kind": "named_query", "query": "content.talk_segments", "params": { "talk_id": "$talk.rows[0].talk_id", "from_ms": null, "to_ms": null, "query": "sandbox" } }
        ]
      }
      ```
    expected_shape: |
      Rows ordered by `start_ms`: `node_id`, `unit_kind` (`transcript_segment` or `slide`), `start_ms`, `end_ms`, `slide_n`, `text`, `document_id`, `representation_id`, `logical_key`. The `node_id` is the locator anchor for a citation (selector kind media_timecode).
    pitfalls: |
      Timecodes are milliseconds. A window may span a slide change: slides and transcript segments interleave by `start_ms`. `query` is a text filter on the segment text, not semantic — use `tasks/talks-on-topic.md` for meaning. The talk's transcript is a `content.document` (document type `aie_talk` or `video_transcript`) of the talk work entity; `q:content.document_units` shows all unit kinds of that document (`talk_header`, `talk_resource`, `talk_writeup`, …).
    provenance: model_assisted
    reviewed: null

  - slug: talk-to-repo-to-paper
    title: From a talk to the code it demos and the paper behind it
    domains: [api-surface, relationships]
    queries: [catalog.talks, catalog.software, catalog.papers, entity.relationships, relationships.current_by_kind]
    aliases: [talk code, has_code, paper behind, repo for talk, technique lineage]
    navigation: |
      `q:catalog.talks` (`repositories` column) → `q:catalog.software` (`kind: repository`) → `q:catalog.papers` (`repositories`, `techniques`, `talks_about`); edges by hand with `q:entity.relationships`.
    operation: |
      ```json
      {
        "schemaVersion": "knowledge-read-intent.v1",
        "intentId": "talk-repo-paper",
        "operations": [
          { "opId": "talk", "kind": "named_query", "query": "catalog.talks", "params": { "text": "Agentic RAG", "event_id": null, "limit": 5 } },
          { "opId": "edges", "kind": "named_query", "query": "entity.relationships", "params": { "entity_id": "$talk.rows[0].talk_id", "kind": "has_code", "direction": "outgoing" } },
          { "opId": "repo", "kind": "named_query", "query": "catalog.software", "params": { "kind": "repository", "text": "$talk.rows[0].repositories[0]", "limit": 5 } },
          { "opId": "paper", "kind": "named_query", "query": "catalog.papers", "params": { "text": "$repo.rows[0].software", "limit": 10 } }
        ]
      }
      ```
    expected_shape: |
      `talk.repositories` names the has_code targets; `repo` rows carry `repository_url`, `developers`, `latest_release`, `stars`, `concepts`; `paper` rows carry `arxiv_id`, `doi`, `authors`, `repositories` (backed_by_repository), `techniques` (introduces_technique) and `talks_about`. `edges` gives the raw `catalog.relationship` rows with `primary_claim_id`.
    pitfalls: |
      The kinds are `has_code` (talk → repository), `backed_by_repository` (paper → repository), `introduces_technique` / `uses_technique` and `about` — check `q:vocab.relationship_kind` before asserting a new edge. A repository and a library are different entities (`backed_by_repository` vs `version_of`). Text filters on L1 views are substring matches; prefer ids once you have them.
    provenance: model_assisted
    reviewed: null

  - slug: modules-covering-concept
    title: Which of our modules cover <concept>, and what guidance exists for it?
    domains: [authoring, api-surface, guidance, retrieval]
    queries: [catalog.concepts, ours.works_authored, guidance.items, retrieval.search_unified, catalog.software]
    aliases: [coverage, modules about, course coverage, what do we teach about]
    navigation: |
      `q:catalog.concepts` (`modules_covering`, `guidance_items` counts) → `q:ours.works_authored` (text matches `covers_concepts`) → `q:guidance.items` → `q:retrieval.search_unified` with lens ours.
    operation: |
      ```json
      {
        "schemaVersion": "knowledge-read-intent.v1",
        "intentId": "coverage-mcp",
        "operations": [
          { "opId": "concept", "kind": "named_query", "query": "catalog.concepts", "params": { "text": "MCP", "limit": 5 } },
          { "opId": "modules", "kind": "named_query", "query": "ours.works_authored", "params": { "kind": "module", "released": null, "text": "MCP", "limit": 50 } },
          { "opId": "guidance", "kind": "named_query", "query": "guidance.items", "params": { "kind": null, "entity_id": "$concept.rows[0].concept_id", "text": null, "limit": 50 } },
          { "opId": "passages", "kind": "named_query", "query": "retrieval.search_unified", "params": { "query": "Model Context Protocol server", "lenses": ["ours"], "space_slugs": ["own_content"], "limit": 20 } }
        ]
      }
      ```
    expected_shape: |
      `modules` rows: `work_id`, `kind`, `slug`, `title`, `head_revision_id`, `released`, `covers_concepts`, `uses_software`, `runtime_requirements`, `source_tier` 1. `guidance` rows: typed items (failure_mode, solution_pattern, …) with `assurance_level` and `subject_entity_ids`. `concept` row counts (`works_about`, `implementations`, `guidance_items`, `modules_covering`) tell you how much exists before you read.
    pitfalls: |
      Coverage is declared by `authoring.revision_binding` on the head revision; an unreleased draft counts in `modules_covering` unless you filter `released: true`. Lens ours passages exist only for released material indexed in `own_content`; drafts are not searchable. Guidance items are corpus knowledge about the concept, not our teaching text — cite them in a module rather than restating them.
    provenance: model_assisted
    reviewed: null

  - slug: modules-affected-by-release
    title: Which of our modules does a new software release affect?
    domains: [authoring, api-surface]
    queries: [catalog.software_releases, ours.modules_affected_by_release, ours.works_authored]
    aliases: [flywheel, release impact, stale modules, needs review after release]
    navigation: |
      `tasks/release-history.md` → `q:catalog.software_releases` (get `release_id`) → `functions/api/modules_affected_by_release.md` → `q:ours.modules_affected_by_release` → `ops/revise_work.md`.
    operation: |
      ```json
      {
        "schemaVersion": "knowledge-read-intent.v1",
        "intentId": "flywheel-langgraph",
        "operations": [
          { "opId": "releases", "kind": "named_query", "query": "catalog.software_releases", "params": { "software_id": null, "text": "langgraph", "limit": 5 } },
          { "opId": "affected", "kind": "named_query", "query": "ours.modules_affected_by_release", "params": { "release_id": "$releases.rows[0].release_id" } }
        ]
      }
      ```

      Then, per affected head revision, read it with `api.product_read(workspace, 'get_revision', {"revision_id": …})` and propose a new revision with `api.product_command(workspace, 'revise_work', key, head, {"work_id": …, "revision": {…}})` (`ops/revise_work.md`), or record a `review_revision` with reviewType `runtime_review`.
    expected_shape: |
      Rows: `work_id`, `work_kind`, `work_slug`, `revision_id`, `revision_title`, `revision_created_at`, `software`, `release`, `released_at`, `breaking`, `binding` (uses | covers | requires), `version_spec`. `breaking = true` rows need review first.
    pitfalls: |
      Only head revisions authored *before* the release appear; a revision created after it is assumed to know about it. `version_spec` is the author's declared range — a release inside the range is not "affected" unless `breaking`. Agents may propose revisions and `runtime_review` events but cannot record human `release_review` approvals. Curriculum `curriculum.release_transition` is about *our* releases, not software releases.
    provenance: model_assisted
    reviewed: null

  - slug: search-my-notes
    title: Search my own notes, uploads and conversations (private lens)
    domains: [library, retrieval, access]
    queries: [retrieval.search_unified]
    aliases: [my notes, private search, search uploads, search conversations, learner notes]
    navigation: |
      `domains/library.md` → `ops/search.md` (the product operation) or `q:retrieval.search_unified` with `lenses: [private]` and your `workspace_ids`.
    operation: |
      Through the product (readability rules applied for you):

      ```sql
      select api.product_read(p_workspace_id, 'search', '{"query": "retry with exponential backoff", "limit": 20}'::jsonb);
      ```

      Through the catalog as an operator (you must pass the workspaces you may read):

      ```json
      {
        "schemaVersion": "knowledge-read-intent.v1",
        "intentId": "my-notes-backoff",
        "operations": [
          { "opId": "notes", "kind": "named_query", "query": "retrieval.search_unified", "params": { "query": "retry with exponential backoff", "lenses": ["private", "ours"], "space_slugs": ["learner_notes", "own_content"], "workspace_ids": ["0192a000-0000-7000-8000-000000000001"], "limit": 20 } }
        ]
      }
      ```
    expected_shape: |
      Product `search` returns `[{label, passageId, revisionId, workKind, locator, snippet, rank, lens, tier, channels}]` with `label` in private_note | uploaded_source | conversation | course_material. The catalog form returns `vector_item_id`, `lens`, `source_tier`, `target_kind` = passage, `target_id` (the `library.passage` id), `workspace_id`, `snippet`, `fused_score`.
    pitfalls: |
      Private items are returned only for the `workspace_ids` passed in; an empty list or null returns no private rows (no error). The product operation additionally hides purged revisions, redacted messages, removed resources and `deny_all` restricted artifacts — the raw catalog query does not, so prefer `ops/search.md` for learners. Without an embedding the search is lexical (english full-text + trigram). Notes become searchable only after the worker `index_passages` runs.
    provenance: model_assisted
    reviewed: null

  # ---------------------------------------------------------------- baseline and ingestion
  - slug: what-do-we-know-about-entity
    title: What do we already know about <name>?
    domains: [identity, temporal-facts, relationships, evidence, guidance]
    queries: [entity.resolve, entity.card, entity.attributes, entity.relationships, evidence.claims_for_entity, guidance.items, knowledge.head]
    aliases: [baseline, prior knowledge]
    navigation: |
      `domains/identity.md` → `queries/README.md` (entity.*); for a whole kind use the L1 views (`tasks/compare-models.md`).
    operation: |
      ```json
      {
        "schemaVersion": "knowledge-read-intent.v1",
        "intentId": "openai-baseline",
        "operations": [
          { "opId": "resolve", "kind": "named_query", "query": "entity.resolve", "params": { "text": "OpenAI" } },
          { "opId": "card", "kind": "named_query", "query": "entity.card", "params": { "entity_id": "$resolve.rows[0].entity_id" } },
          { "opId": "attrs", "kind": "named_query", "query": "entity.attributes", "params": { "entity_id": "$resolve.rows[0].entity_id" } },
          { "opId": "rels", "kind": "named_query", "query": "entity.relationships", "params": { "entity_id": "$resolve.rows[0].entity_id", "direction": "both" } },
          { "opId": "claims", "kind": "named_query", "query": "evidence.claims_for_entity", "params": { "entity_id": "$resolve.rows[0].entity_id", "limit": 100 } },
          { "opId": "guidance", "kind": "named_query", "query": "guidance.items", "params": { "entity_id": "$resolve.rows[0].entity_id", "limit": 50 } },
          { "opId": "head", "kind": "named_query", "query": "knowledge.head" }
        ]
      }
      ```
    expected_shape: |
      `resolve` rows: entity_id, kind, display_name, score (≤ 25, best first). `card` is one JSON object with entity, aliases, facts[], relationships[], events[], sources[]. `attrs` is the row with its kind-validated `attributes` and the kind's `attributes_schema`. The snapshot knowledge_seq is the value for `expectedKnowledgeHead`.
    pitfalls: |
      `q:entity.card` shows current facts only (valid_during contains now() via `api.entity_at` defaults). For a historical date use `q:entity.at`. Merged entities are excluded by `api.resolve_entity`; follow merged_into_id if you hold an old id. Attributes never hold numbers that change — look at facts for prices, context windows, headcount.
    provenance: model_assisted
    reviewed: null

  - slug: resolve-or-create-entity
    title: Resolve or create an entity
    domains: [identity, staging]
    queries: [entity.resolve, entity.by_identifier, entity.attributes, staging.unresolved]
    aliases: [create entity, identity]
    navigation: |
      `domains/identity.md` → `domains/staging.md` → `tasks/stage-uncertain-candidate.md`
    operation: |
      Read first, then ingest only if resolve and identifier miss:

      ```json
      {
        "schemaVersion": "knowledge-read-intent.v1",
        "intentId": "resolve-gpt-offering",
        "operations": [
          { "opId": "id", "kind": "named_query", "query": "entity.by_identifier", "params": { "scheme": "other", "value": "gpt-5.6-terra" } },
          { "opId": "name", "kind": "named_query", "query": "entity.resolve", "params": { "text": "GPT-5.6 Terra" } }
        ]
      }
      ```

      ```json
      {
        "schemaVersion": "knowledge-ingestion-intent.v1",
        "intentId": "create-gpt-5-6-terra-offering",
        "expectedKnowledgeHead": 41,
        "onStale": "rebase_if_disjoint",
        "subjects": [
          {
            "ref": "gpt-5.6-terra-offering",
            "mode": "new",
            "kind": "model_offering",
            "displayName": "GPT-5.6 Terra (API)",
            "attributes": { "offering_key": "gpt-5.6-terra", "region": "global", "tier": "standard" },
            "identifiers": [{ "scheme": "other", "value": "gpt-5.6-terra" }],
            "onMatch": "review"
          }
        ],
        "proposals": [
          { "proposalId": "p-create", "kind": "entity.create", "subjectRef": "gpt-5.6-terra-offering", "belief": "accepted" }
        ]
      }
      ```
    expected_shape: |
      Identifier hit: one row, score implied 1.0. Name resolve: score ≥ 0.98 means use the existing id. Otherwise a new subject becomes one `catalog.entity` row whose `attributes` passed the kind's `attributes_schema`, after a receipt.
    pitfalls: |
      `kind` must be a `taxonomy.entity_kind` code and `attributes` must satisfy that kind's schema (`model_offering` requires `offering_key`; `ai_model_version` requires `version_label`). Do not invent identifier schemes; the scheme check is a closed list (use `other` when there is no native scheme). High-confidence matches without `onMatch: use_existing` become `review_required`. A `model_offering` also needs its parent `ai_model_version` and an `offered_as` relationship.
    provenance: model_assisted
    reviewed: null

  - slug: record-price-change
    title: Record a price change with world-time
    domains: [temporal-facts]
    queries: [vocab.stream_kind, facts.price_history, facts.history_for_stream, entity.at, knowledge.head]
    aliases: [price, pricing]
    navigation: |
      `domains/temporal-facts.md` → `vocabularies/temporal.stream_kind.md` → `q:facts.price_history`
    operation: |
      ```json
      {
        "schemaVersion": "knowledge-ingestion-intent.v1",
        "intentId": "openai-terra-input-price",
        "expectedKnowledgeHead": 41,
        "onStale": "rebase_if_disjoint",
        "subjects": [{ "ref": "offering", "mode": "resolved", "entityId": "0192b000-0000-7000-8000-000000000001", "kind": "model_offering" }],
        "proposals": [
          {
            "proposalId": "p-price",
            "kind": "fact.assert_state",
            "subjectRef": "offering",
            "streamKind": "offering_price",
            "scopeKey": "input_tokens||",
            "worldInterval": { "from": "2026-08-20T00:00:00Z", "to": null, "bounds": "[)" },
            "amount": 2.5,
            "currency": "USD",
            "unit": "usd_per_1m_tokens",
            "payload": { "meter": "input_tokens" },
            "extent": { "sourceText": "August 20, 2026", "precision": "day", "earliest": "2026-08-20", "latest": "2026-08-20" },
            "temporalBasis": "explicit",
            "belief": "accepted"
          }
        ]
      }
      ```
    expected_shape: |
      One new `temporal.segment` on stream (offering_price, offering, `input_tokens||`). Re-query with `q:facts.price_history` (`meter: input_tokens`) to see closed predecessors, or `q:entity.at` at the world instant.
    pitfalls: |
      `payload.meter` is required by `temporal.stream_kind:offering_price`; `scopeKey` is `meter|tier|region` and the database enforces no naming convention for it. Read `q:facts.price_history` first: if the offering already has a current segment for this meter under another `scope_key`, reuse that key exactly, or the old price stays current beside the new one (rule price.scope_key_is_meter). `unit` must be in the stream kind's `unit_values` (check `q:vocab.stream_kind`). Currency must be three ASCII letters. temporal_basis explicit requires an extent.
    provenance: model_assisted
    reviewed: null

