format: ai-engineer-workspace-enrichment/1
relations:
  # ---------------------------------------------------------------- catalog
  - relation: catalog.entity
    domain: identity
    aliases: [entity, canonical entity, identity row]
    summary: One row per canonical identity; kind-specific attributes are a jsonb validated by taxonomy.entity_kind.attributes_schema.
    notes: |
      Build 08 replaced the thin typed tables (corpus.organization, corpus.person, …) with
      `attributes`, validated per kind by `catalog.validate_entity_attributes`; read the kind's
      `taxonomy.entity_kind.attributes_schema` for its keys (e.g. ai_model_version needs
      version_label; model_offering needs offering_key; community_actor is platform + handle only).
      Anything that changes over time (price, context window, stars)
      is a fact stream, never an attribute. Work kinds also have a `catalog.work` row.
    column_notes:
      kind: "FK to taxonomy.entity_kind; selects the attributes_schema and parent_kind."
      attributes: "Kind-specific attributes validated by the kind's JSON Schema; additionalProperties true, so unknown keys pass but should be rare. Never numbers that move."
      lifecycle: "active, merged, or retired. Resolve hides merged."
      merged_into_id: "Set when lifecycle is merged."
      display_name: "Projection of the entity_name stream, not a unique key."
      projection_knowledge_seq: "Knowledge head at which display_name/slug were last projected (catalog.rebuild_entity_projections)."
      created_by_receipt_id: "Required; executor writes the receipt first."
    examples:
      - title: Resolve OpenAI
        query: entity.resolve
        params: { text: OpenAI }
        note: Active rows only; score combines name, alias, and identifier.
      - title: Row with validated attributes and the kind schema
        query: entity.attributes
        params: { entity_id: "0192b000-0000-7000-8000-000000000001", kind: null }
        note: attributes_schema tells you which keys the kind expects.
    provenance: model_assisted
    reviewed: null

  - relation: catalog.entity_alias
    domain: identity
    aliases: [alias, synonym]
    summary: Typed alternate name for one entity; unique per entity, not globally.
    column_notes:
      alias_kind: "synonym, acronym, former_name, handle, ticker, slug, misspelling, translation, model_alias."
      alias_normalized: "Generated lower(btrim(alias))."
    examples:
      - title: Name resolve uses aliases
        query: entity.resolve
        params: { text: OpenAI }
        note: Trigram match on alias as well as display_name.
    provenance: model_assisted
    reviewed: null

  - relation: catalog.entity_identifier
    domain: identity
    aliases: [external id, scheme]
    summary: Schemed external identifier; unique per tenant on (scheme, value).
    column_notes:
      scheme: "Closed check list (github, doi, arxiv, youtube_video, other, …)."
      value: "Exact match; resolve_entity treats an exact value as score 1.0."
    examples:
      - title: Lookup by GitHub repo
        query: entity.by_identifier
        params: { scheme: github, value: openai/openai-python }
        note: Empty if that identifier has not been admitted.
    provenance: model_assisted
    reviewed: null

  - relation: catalog.entity_merge
    domain: identity
    aliases: [merge]
    summary: Durable merge of two entities; loser becomes lifecycle merged.
    column_notes:
      from_entity_id: "Loser; must differ from to_entity_id."
      receipt_id: "Required."
    examples:
      - title: Card of the surviving entity
        query: entity.card
        params: { entity_id: "0192b000-0000-7000-8000-000000000001" }
        note: Follow merged_into_id if you still hold the loser id.
    provenance: model_assisted
    reviewed: null

  - relation: catalog.work
    domain: identity
    aliases: [published work, bibliographic row, paper row, talk row]
    summary: Bibliographic row behind a work entity (paper, talk, media work, story, case study); content lives in content.document.
    column_notes:
      kind: "The work entity kind (paper, talk, media_work, story, case_study); taxonomy.entity_kind.is_work."
      venue_entity_id: "Where it appeared: an industry_event, media_channel or publisher organization."
      duration_ms: "For talks and media works; transcript timecodes stay inside that range."
      attributes: "Work-level attributes beyond the entity attributes (edition, language variants)."
    examples:
      - title: Talks are works
        query: catalog.talks
        params: { text: null, event_id: null, limit: 20 }
        note: The L1 view joins the entity, the work row and the presented_at / presented_by edges.
    provenance: model_assisted
    reviewed: null

  - relation: catalog.relationship
    domain: relationships
    aliases: [edge, link]
    summary: One edge table; kinds constrain endpoints and may be temporal.
    column_notes:
      qualifier: "Disambiguates parallel edges of the same kind."
      episode: "Integer >= 1 for repeated engagements."
      k_to: "Null means current knowledge of the edge."
    examples:
      - title: Current develops edges
        query: relationships.current_by_kind
        params: { kind: develops, entity_id: null, limit: 50 }
        note: Temporal kinds also require an active relationship_active segment.
    provenance: model_assisted
    reviewed: null

  - relation: taxonomy.entity_kind
    domain: identity
    aliases: [entity vocabulary, kinds]
    summary: Closed list of entity kinds with the JSON Schema that validates catalog.entity.attributes, the parent kind and the work flag.
    column_notes:
      attributes_schema: "JSON Schema (pg_jsonschema) for catalog.entity.attributes of this kind."
      parent_kind: "Kind whose rows this kind versions or belongs to (model version -> model); the link itself is a catalog.relationship."
      is_work: "True for kinds that also have a catalog.work row and content.document rows."
      lens: "Whose knowledge rows of this kind are (corpus for every industry kind)."
    examples:
      - title: Attributes with their kind schema
        query: entity.attributes
        params: { entity_id: "0192b000-0000-7000-8000-000000000001", kind: organization }
        note: Join uses ek.code = entity.kind.
    provenance: model_assisted
    reviewed: null

  - relation: taxonomy.relationship_kind
    domain: relationships
    aliases: [relationship vocabulary]
    summary: Edge vocabulary with endpoint kinds, temporal flag, and property schema.
    column_notes:
      from_kinds: "Allowed from-entity kinds."
      to_kinds: "Allowed to-entity kinds."
      temporal: "When true, a relationship_active stream is required."
    examples:
      - title: employed_by slot
        query: vocab.relationship_kind
        params: { code: employed_by }
        note: person to organization, temporal true.
    provenance: model_assisted
    reviewed: null

  # ---------------------------------------------------------------- temporal
  - relation: temporal.knowledge_head
    domain: temporal-facts
    aliases: [head, tenant clock]
    summary: One row per tenant; knowledge_seq is the sealed-batch clock and open_xid/open_k mark an open batch.
    column_notes:
      knowledge_seq: "Last sealed sequence; begin_batch compares p_expected_head to this value."
      open_xid: "Transaction id of the open batch; null when the head is idle."
      open_k: "Sequence that stamp_k will write; equal to knowledge_seq+1 while a batch is open."
    examples:
      - title: Read the current head
        query: knowledge.head
        params: {}
        note: app_reader path; returns 0 when no batch has been sealed.
    provenance: model_assisted
    reviewed: null

  - relation: temporal.knowledge_batch
    domain: temporal-facts
    aliases: [sealed batch]
    summary: One sealed admission transaction with receipt, idempotency key, and input digest.
    column_notes:
      receipt_id: "Not null FK to orchestration.operation_receipt; required before facts can exist."
      idempotency_key: "Unique per tenant; duplicate submits reuse this batch."
      input_digest: "64 lowercase hex chars of the intent digest."
    examples:
      - title: Intent plus sealed batch
        query: receipts.for_intent
        params: { intent_id: "0192f000-0000-7000-8000-000000000001" }
        note: Joins on idempotency_key because pipeline_agent cannot select operation_receipt.
    provenance: model_assisted
    reviewed: null

  - relation: temporal.extent
    domain: temporal-facts
    aliases: [date extent]
    summary: Source text for a date with precision and optional earliest/latest bounds.
    column_notes:
      precision: "instant, day, month, quarter, year, relative, or unknown."
      locator_id: "Optional quote that proved the date."
    examples:
      - title: Facts that required an extent
        query: entity.at
        params: { entity_id: "0192b000-0000-7000-8000-000000000001", at: "2026-03-15T00:00:00Z", k: 0 }
        note: explicit and carry_forward segments always have extent_id set.
    provenance: model_assisted
    reviewed: null

  - relation: temporal.stream
    domain: temporal-facts
    aliases: [fact series, stream slot]
    summary: Identity of a fact series, unique on kind, subject, and scope_key.
    column_notes:
      scope_key: "Distinguishes parallel series; default empty string. Prices use meter|tier|region. Not validated against any convention: a correction reuses the existing series key."
      subject_entity_id: "Exactly one of subject_entity_id or subject_relationship_id is set."
    examples:
      - title: History on one stream slot
        query: facts.history_for_stream
        params: { entity_id: "0192b000-0000-7000-8000-000000000001", stream_kind: offering_price, scope_key: "input_tokens||", limit: 50, offset: 0 }
        note: Subject is the offering; scope_key is meter|tier|region.
    provenance: model_assisted
    reviewed: null

  - relation: temporal.segment
    domain: temporal-facts
    aliases: [fact, temporal fact, state segment]
    summary: "A fact on a stream: world interval valid_during, knowledge interval [k_from,k_to). One home for every number."
    column_notes:
      valid_during: "World interval [), bounded below, not empty."
      k_to: "Null means current knowledge; closure only via helpers."
      temporal_basis: "explicit and carry_forward require extent_id."
      replaces_segment_id: "Set by assert_state when splitting or replacing."
      unit: "Must be in stream_kind.unit_values when that list is present."
      payload: "Validated by stream_kind.payload_schema; offering_price requires meter."
    examples:
      - title: Input price history of an offering with both clocks
        query: facts.price_history
        params: { offering_id: "0192b000-0000-7000-8000-000000000001", meter: input_tokens }
        note: Includes superseded beliefs (k_to set).
    provenance: model_assisted
    reviewed: null

  - relation: temporal.event
    domain: temporal-facts
    aliases: [event identity]
    summary: Event identity (kind, subject, optional object/relationship, dedupe_key).
    column_notes:
      dedupe_key: "Optional natural key so the same announcement is not inserted twice."
    examples:
      - title: Current occurrences for a subject
        query: events.current_for_entity
        params: { entity_id: "0192b000-0000-7000-8000-000000000001" }
        note: Joins through event_occurrence where k_to is null.
    provenance: model_assisted
    reviewed: null

  - relation: temporal.event_occurrence
    domain: temporal-facts
    aliases: [occurrence]
    summary: K-stamped occurrence of an event (actual, scheduled, or cancelled).
    column_notes:
      occurrence_mode: "actual, scheduled, or cancelled."
      occurred_during: "World interval [), bounded below."
    examples:
      - title: Current events view
        query: events.current_for_entity
        params: { entity_id: "0192b000-0000-7000-8000-000000000001" }
        note: One current occurrence per event.
    provenance: model_assisted
    reviewed: null

  - relation: temporal.stream_kind
    domain: temporal-facts
    aliases: [stream vocabulary]
    summary: Slot rules for a fact series (subject kinds, status values, units, payload schema); offering_price and benchmark_score are the one home for numbers.
    column_notes:
      subject_mode: "entity or relationship."
      unit_values: "Closed list when requires_amount is true."
      payload_schema: "JSON Schema for segment.payload (offering_price requires meter; tier, region, condition optional)."
    examples:
      - title: Price slot rules
        query: vocab.stream_kind
        params: { code: offering_price }
        note: requires_amount true; payload.meter required.
    provenance: model_assisted
    reviewed: null

  - relation: temporal.event_kind
    domain: temporal-facts
    aliases: [event vocabulary]
    summary: Event vocabulary with subject and object kinds and optional start/end stream kinds.
    column_notes:
      starts_stream_kind: "Optional stream this event opens."
      ends_stream_kind: "Optional stream this event closes."
    examples:
      - title: Price-changed event kind
        query: vocab.event_kind
        params: { code: price_changed }
        note: Subject kinds include model_offering and compute_offering.
    provenance: model_assisted
    reviewed: null

  # ---------------------------------------------------------------- evidence, verification, acquisition
  - relation: evidence.source
    domain: evidence
    aliases: [source, URL]
    summary: Canonical source (URL/domain) with revisit and publisher pointers.
    column_notes:
      registrable_domain: "Filter key for sources_by_domain."
      publisher_entity_id: "Optional catalog.entity of the publisher."
      next_revisit_after: "When the refresh may fetch again."
    examples:
      - title: Sources on openai.com
        query: evidence.sources_by_domain
        params: { domain: openai.com, limit: 50 }
        note: Empty on an unpopulated tenant.
    provenance: model_assisted
    reviewed: null

  - relation: evidence.source_capture
    domain: evidence
    aliases: [capture]
    summary: One immutable capture of a source, hashed and stored as an artifact; points at the acquisition fetch that produced it.
    column_notes:
      content_sha256: "Digest of captured bytes."
      capture_method: "FK to evidence.capture_method."
      acquisition_fetch_id: "Producer when the bytes came from a product/harness fetch (acquisition.fetch) rather than a mission attempt or a KS operation."
    examples:
      - title: Captures for one source
        query: evidence.captures_for_source
        params: { source_id: "0192e000-0000-7000-8000-000000000001" }
        note: Insert-only.
    provenance: model_assisted
    reviewed: null

  - relation: evidence.locator
    domain: evidence
    aliases: [quote, selector]
    summary: Precise selection inside a capture (text quote, table cell, timecode, page+bbox) with selected_content_sha256 and a normalized value.
    column_notes:
      selector_kind: "text_quote, table, media_timecode, page_bbox, json_pointer, line_range."
      selected_content_sha256: "Digest of the selected span, not the whole capture."
      normalized_value: "The value as read, normalized (api.fact_locators shows it beside the fact's amount)."
      start_ms: "Timecode locators: window start in milliseconds."
    examples:
      - title: Where a current price was read
        query: facts.locators
        params: { entity_id: "0192b000-0000-7000-8000-000000000001", stream_kind: offering_price, scope_key: null }
        note: Returns locator, capture URL/time and the typed unit (document_node_id).
    provenance: model_assisted
    reviewed: null

  - relation: evidence.claim
    domain: evidence
    aliases: [claim]
    summary: Atomic statement with type, status, and creating receipt.
    column_notes:
      status: "Enum including proposed, verified, disputed, retracted, superseded."
      structured: "JSONB; verification manifest digest lives under structured.verification."
    examples:
      - title: Claims naming an entity
        query: evidence.claims_for_entity
        params: { entity_id: "0192b000-0000-7000-8000-000000000001", limit: 100 }
        note: Joins claim_subject.
    provenance: model_assisted
    reviewed: null

  - relation: evidence.claim_subject
    domain: evidence
    aliases: [claim role]
    summary: Entity participation in a claim as subject, object, or context.
    column_notes:
      role: "subject, object, or context."
    examples:
      - title: Claims for an entity
        query: evidence.claims_for_entity
        params: { entity_id: "0192b000-0000-7000-8000-000000000001", limit: 100 }
        note: Primary key includes role so the same entity can appear in more than one role.
    provenance: model_assisted
    reviewed: null

  - relation: evidence.segment_support
    domain: evidence
    aliases: [support]
    summary: K-stamped link from a claim and locator to a segment or occurrence.
    column_notes:
      role: "supports, challenges, or context."
      segment_id: "Exactly one of segment_id or event_occurrence_id."
    examples:
      - title: Support for one claim
        query: evidence.claim_support
        params: { claim_id: "0192d000-0000-7000-8000-000000000001" }
        note: Written only through temporal.admit_support.
    provenance: model_assisted
    reviewed: null

  - relation: evidence.extraction_record
    domain: evidence
    aliases: [extraction, act 2]
    summary: Faithful extraction anchored on a typed unit and interpreted through an assertion mapping.
    column_notes:
      document_node_id: "Act 2 anchor: the typed unit this extraction reads (units are stable; chunks are derived)."
      mapping_id: "Act 3 template used to interpret this unit into a claim (content.unit_assertion_mapping)."
    examples:
      - title: Unit behind a current fact
        query: facts.locators
        params: { entity_id: "0192b000-0000-7000-8000-000000000001", stream_kind: offering_price, scope_key: null }
        note: document_node_id, unit_kind and logical_key columns come from this anchor.
    provenance: model_assisted
    reviewed: null

  - relation: evidence.source_query
    domain: evidence
    aliases: [search query]
    summary: One provider query issued during discovery.
    column_notes:
      provider_code: "FK to evidence.search_provider."
      purpose: "Why the query was issued."
    examples:
      - title: Sources discovered under a domain
        query: evidence.sources_by_domain
        params: { domain: openai.com, limit: 50 }
        note: Queries themselves are not in the catalog; start from the resulting sources.
    provenance: model_assisted
    reviewed: null

  - relation: evidence.capture_method
    domain: evidence
    aliases: [capture method]
    summary: Vocabulary of how a source_capture was taken.
    column_notes:
      code: "Stable method code referenced by evidence.source_capture.capture_method."
    examples:
      - title: Captures for one source
        query: evidence.captures_for_source
        params: { source_id: "0192e000-0000-7000-8000-000000000001" }
        note: capture_method on each row is a code from this table.
    provenance: model_assisted
    reviewed: null

  - relation: verification.use_admission
    domain: evidence
    lens: evidence
    aliases: [admission ledger, admitted use, use decision]
    summary: Append-only record that knowledge_verification admitted a use decision inside the writing transaction; required before a claim is verified.
    column_notes:
      use_decision_id: "The component's use decision; a verified claim's receipt names it."
      bound_effect_digest: "Digest of the exact effect the decision was bound to."
      xact_id: "Transaction in which verification.assert_admitted_use ran; the canonical rows commit with it or not at all."
    examples:
      - title: Claims that must carry an admission
        query: evidence.claims_for_entity
        params: { entity_id: "0192b000-0000-7000-8000-000000000001", limit: 100 }
        note: status verified implies a use_admission row in the same transaction (ADMISSION_REQUIRED otherwise).
    provenance: model_assisted
    reviewed: null

  - relation: acquisition.fetch
    domain: acquisition
    aliases: [fetch, fetch ledger, spend]
    summary: One attempt to obtain bytes from a URL — who, with what tool, outcome, hash, spend — recorded before any capture exists.
    column_notes:
      origin_kind: "product, harness or mission; origin_label and actor_principal_id / mc_mission_id say who."
      outcome: "fetched, unchanged (same bytes as prior_capture_id), blocked, failed."
      prior_capture_id: "Capture whose bytes an unchanged outcome matched; no new document version is created."
      cost_usd: "Spend of this fetch; credits_used for credit-metered tools."
    examples:
      - title: Fetch history and spend for a URL
        query: acquisition.fetches_for_url
        params: { url: null, limit: 50 }
        note: Newest first; unchanged rows are honest no-ops.
    provenance: model_assisted
    reviewed: null

  # ---------------------------------------------------------------- staging
  - relation: staging.candidate
    domain: staging
    aliases: [candidate]
    summary: Proposed identity awaiting resolution; not a draft fact.
    column_notes:
      proposed_kind: "FK to taxonomy.entity_kind."
      resolved_entity_id: "Set after a match or create decision."
    examples:
      - title: Unresolved candidates
        query: staging.unresolved
        params: { limit: 50 }
        note: Excludes create/match/reject decisions.
    provenance: model_assisted
    reviewed: null

  - relation: staging.identity_match
    domain: staging
    aliases: [match]
    summary: Scored match between a candidate and an existing entity.
    column_notes:
      confidence: "0..1."
      method: "How the match was produced."
    examples:
      - title: Candidates of one kind
        query: staging.candidates_for_kind
        params: { proposed_kind: organization, limit: 50 }
        note: Inspect identity_match rows for those candidate ids next.
    provenance: model_assisted
    reviewed: null

  - relation: staging.resolution_decision
    domain: staging
    aliases: [resolution]
    summary: create, match, reject, or defer decision with a receipt.
    column_notes:
      decision: "create, match, reject, defer."
      receipt_id: "Required."
    examples:
      - title: Still unresolved
        query: staging.unresolved
        params: { limit: 50 }
        note: A create/match/reject row removes the candidate from this query.
    provenance: model_assisted
    reviewed: null

  - relation: staging.vetting_decision
    domain: staging
    aliases: [vetting]
    summary: admit, reject, or defer vetting decision with a receipt.
    column_notes:
      decision: "admit, reject, defer."
      reason: "Required text."
    examples:
      - title: Candidates awaiting work
        query: staging.unresolved
        params: { limit: 50 }
        note: Vetting is separate from identity resolution.
    provenance: model_assisted
    reviewed: null

  # ---------------------------------------------------------------- orchestration
  - relation: orchestration.operation_intent
    domain: orchestration-ledger
    aliases: [intent]
    summary: Durable proposed operation with unique idempotency_key.
    column_notes:
      intent_type: "FK to orchestration.intent_type; knowledge_ingestion is the workspace write."
      idempotency_key: "Unique; duplicate submits return duplicate_of."
      preconditions: "Includes expectedKnowledgeHead and snapshotDigest."
    examples:
      - title: One intent
        query: receipts.for_intent
        params: { intent_id: "0192f000-0000-7000-8000-000000000001" }
        note: Returns the intent even when no batch has sealed.
    provenance: model_assisted
    reviewed: null

  - relation: orchestration.operation_receipt
    domain: orchestration-ledger
    aliases: [receipt]
    summary: Immutable outcome of one intent (applied, rejected, noop, partial).
    column_notes:
      outcome: "applied, rejected, noop, or partial."
      intent_id: "Unique; one receipt per intent."
    examples:
      - title: Batch that cites the receipt id
        query: receipts.for_intent
        params: { intent_id: "0192f000-0000-7000-8000-000000000001" }
        note: pipeline_agent cannot SELECT this table; the catalog query returns receipt_id from knowledge_batch.
    provenance: model_assisted
    reviewed: null

  - relation: orchestration.artifact
    domain: orchestration-ledger
    aliases: [artifact]
    summary: Content-addressed stored object typed by artifact_type; product uploads and course assets register here too.
    column_notes:
      sha256: "64 lowercase hex; unique with artifact_type."
      bucket_class: "source_captures, candidate, accepted, ledger, or published."
      storage_state: "pending until the worker verifies the object (complete_asset), then available."
    examples:
      - title: Ingestion receipts on disk
        query: artifacts.by_type
        params: { artifact_type: knowledge_ingestion_receipt, limit: 50 }
        note: Agents read bytes through the executor, not with bucket credentials.
    provenance: model_assisted
    reviewed: null

  - relation: orchestration.artifact_lineage
    domain: orchestration-ledger
    aliases: [lineage]
    summary: Typed edge between artifacts (derived_from, supersedes, corrects, produced_by, consumed_by).
    column_notes:
      relation_kind: "derived_from, supersedes, corrects, produced_by, consumed_by."
      receipt_id: "Set on edges written in the apply transaction."
    examples:
      - title: Artifacts of one type
        query: artifacts.by_type
        params: { artifact_type: knowledge_read_snapshot, limit: 50 }
        note: Snapshot artifacts are derived_from the read intent artifact.
    provenance: model_assisted
    reviewed: null

  # ---------------------------------------------------------------- retrieval
  - relation: retrieval.vector_item
    domain: retrieval
    aliases: [vector item, searchable item]
    summary: One searchable item in one space version with lens, source tier and facets; the one thing api.search_unified ranks.
    column_notes:
      lens: "Whose knowledge: corpus (ingested sources), ours (our courses/guides/reports), private (one workspace's notes, RLS-isolated), evidence (assertions/claims)."
      source_tier: "T0 verified assertions, T1 our content, T2 primary corpus, T3 third-party corpus, T4 live web; a filter and a boost, never a truth claim."
      workspace_id: "Set for lens private; search_unified returns the item only when this id is in p_workspace_ids."
      unit_kind: "Facet copied from the typed unit the item projects (transcript_segment, price_row, …)."
      document_type_code: "Facet copied from the document kind."
      lifecycle: "Only active items are searchable."
      knowledge_seq: "Upper bound filter for as-of-knowledge reads."
    examples:
      - title: Scoped lexical search
        query: retrieval.search_unified
        params: { query: context engineering, lenses: [corpus, ours], limit: 20 }
        note: Result column vector_item_id points here; lens and source_tier are echoed per row.
    provenance: model_assisted
    reviewed: null

  - relation: retrieval.projection_target
    domain: retrieval
    aliases: [projection target]
    summary: What a search projection is about — exactly one of entity, guidance item, chunk, claim, summary, typed unit, digest, authored revision or private passage.
    column_notes:
      target_kind: "Which of the id columns is set."
      record_id: "guidance.item (expert knowledge item) when target_kind = record."
      document_node_id: "content.document_node when the projection is a typed unit."
      digest_id: "content.document_digest when the projection is a digest."
      authored_revision_id: "authoring.work_revision for lens ours items."
      passage_id: "library.passage for private/own passages; soft reference so the retired vector item keeps its target row."
    examples:
      - title: Search results carry target_kind and target_id
        query: retrieval.search_unified
        params: { query: pricing, lenses: [corpus], limit: 20 }
        note: target_kind passage rows resolve to library.passage; unit rows to content.document_node.
    provenance: model_assisted
    reviewed: null

  - relation: retrieval.search_projection
    domain: retrieval
    aliases: [projection]
    summary: Derived text projection that a vector item points at.
    column_notes:
