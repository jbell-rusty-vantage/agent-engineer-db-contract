# Database environment variables read by ai-engineer-db-contract (names only; never values).
# Values: BellLabs/.secrets/aieng-db.env. Source of the database block of .env.example and docs/ENVIRONMENT.md.
# readers are file:line (re-check after edits). No aliases and no fallback to older names.
variables:
  - name: AIENG_DB_ADMIN_DSN
    description: Schema-owner (migration authority) connection string for the AI Engineer Supabase project; Supavisor session pooler, port 5432. Installers and schema-workspace only.
    kind: dsn
    secret: true
    plane: AIENG
    role: ADMIN_DSN
    status: active
    readers:
      - scripts/install-target.mjs:118   # resolveTargetDsn reads the variable NAMED by target.toml database_url_env
      - scripts/schema-workspace/lib/db.mjs:21
    notes: Must equal the database_url_env of platform/mission-control/deployments/ai-engineer/target.toml.
  - name: AIENG_DB_LOCAL_DSN
    description: Loopback (127.0.0.1 / localhost / ::1) Postgres of a disposable local Supabase stack. Native type generation requires port 54322 and the postgres database.
    kind: dsn
    secret: true
    plane: AIENG
    role: LOCAL_DSN
    status: active
    readers:
      - scripts/generate-types.mjs:52
      - scripts/generate-types.mjs:72   # the only database name passed to the generator child
      - scripts/generate-types-native.mjs:9
      - scripts/install-ai-engineer.mjs:436   # set for mission-db in disposable mode; written as database_url_env of the generated mc-target.toml (line 423)
      - scripts/schema-workspace/lib/db.mjs:22   # fallback after AIENG_DB_ADMIN_DSN; refused unless loopback
  - name: AIENG_DB_PROJECT_REF
    description: Supabase project ref of the AI Engineer plane (supabase-blue-ocean). Declared for the shared .env; no script in this repository reads it yet (rule 3 startup check is not implemented here).
    kind: identifier
    secret: false
    plane: AIENG
    role: PROJECT_REF
    status: declared_unread
    readers: []
